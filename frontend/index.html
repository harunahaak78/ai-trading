<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Trading Analyzer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="bar">
        <div class="wrap bar-inner">
            <p class="brand">AI Trading Analyzer</p>

            <form class="controls" id="controls" autocomplete="off">
                <label class="field">
                    <span>Symbol</span>
                    <input id="symbol" name="symbol" list="symbols" value="BTCUSDT" maxlength="15" spellcheck="false">
                    <datalist id="symbols">
                        <option value="BTCUSDT"></option>
                        <option value="ETHUSDT"></option>
                        <option value="BNBUSDT"></option>
                        <option value="SOLUSDT"></option>
                        <option value="XRPUSDT"></option>
                    </datalist>
                </label>

                <label class="field">
                    <span>Data</span>
                    <select id="source" name="source">
                        <option value="live">Live from Binance</option>
                        <option value="wait">Sample: waiting</option>
                        <option value="ready">Sample: buy ready</option>
                    </select>
                </label>

                <label class="check">
                    <input type="checkbox" id="auto">
                    <span>Refresh every minute</span>
                </label>

                <button type="submit" class="btn" id="refresh">Refresh</button>
            </form>

            <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
    </header>

    <main class="wrap" id="view"></main>

    <footer class="wrap foot">
        <p>This is automated analysis from fixed rules, not financial advice. Live candles come from Binance.</p>
    </footer>

    <script type="module" src="src/main.js"></script>
</body>
</html>
